name: Every Day Runner Cron

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run tasks sequentially or in parallel"
        required: false
        default: "sequential"
        type: choice
        options:
          - sequential
          - parallel
  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"
    # 6:00 PM IST = 12:30 PM UTC
    - cron: "30 12 * * *"

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run extraction scripts
        run: npm start
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_PERSONAL_EMAIL: ${{ secrets.MY_PERSONAL_EMAIL }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          JOB_KEYWORD: ${{ secrets.JOB_KEYWORD }}
          JOB_RSS_URL: ${{ secrets.JOB_RSS_URL }}
          RUN_MODE: ${{ github.event.inputs.run_mode || secrets.RUN_MODE || 'sequential' }}
